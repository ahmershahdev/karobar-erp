# Production stack. TLS terminates in front of `web` (Caddy or the host's proxy) and forwards
# to 127.0.0.1:8080. Secrets come from deploy/.env, which is never committed.
name: karobar-prod

x-backend: &backend
  build:
    context: ../backend
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_SITE_URL: ${SITE_URL:?set SITE_URL in deploy/.env}
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on: [api]

  api:
    <<: *backend

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=2

  mysql:
    image: mysql:26.10.0
    env_file: .env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}"]
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  mysql-data:
  redis-data:
