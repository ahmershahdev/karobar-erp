worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 15s;

  client_max_body_size 2m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  large_client_header_buffers 4 8k;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # The TLS proxy reaches us through Docker's port mapping on 127.0.0.1 only, so addresses
  # from private ranges are our own proxies and their X-Forwarded-For can be trusted. Without
  # this, every client would share the proxy's address and its rate limits.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # TLS ends at the proxy in front, so $scheme here is always http. Pass on what it saw.
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
  }

  # Edge limits sit in front of Django's own throttles, so floods are dropped before they
  # reach a gunicorn worker. Keyed by client address; the auth zone is much tighter.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  include /etc/nginx/conf.d/*.conf;
}
