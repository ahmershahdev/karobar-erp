upstream api {
  server api:8000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  limit_conn perip 30;
  # Redirects stay relative: this server sits behind a proxy and doesn't know the public host.
  absolute_redirect off;

  # $request_id is 32 random hex characters per request: a fresh nonce for the CSP below.
  set $csp_nonce $request_id;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location /api/accounts/ {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Every JS and CSS file has .br and .gz twins from the build. try_files doesn't re-run location
  # matching, so these two set the real type themselves, or the .br extension would decide it.
  # gzip stays off here: it can't see add_header, and would compress the .br file a second time.
  location ~ ^/assets/.+\.js$ {
    include /etc/nginx/snippets/assets.conf;
    add_header Content-Encoding $brotli_encoding always;
    gzip off;
    gzip_static on;
    types {}
    default_type application/javascript;
    try_files $uri$brotli_suffix =404;
  }

  location ~ ^/assets/.+\.css$ {
    include /etc/nginx/snippets/assets.conf;
    add_header Content-Encoding $brotli_encoding always;
    gzip off;
    gzip_static on;
    types {}
    default_type text/css;
    try_files $uri$brotli_suffix =404;
  }

  location /assets/ {
    include /etc/nginx/snippets/assets.conf;
    try_files $uri =404;
  }

  # Never cached, or a new release couldn't replace an old worker.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|site\.webmanifest|favicon\.png|icon-192\.png|icon-512\.png|og-image\.png|apple-touch-icon\.png)$ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location ~ ^/(login|signup|forgot-password|reset-password|verify-email|accept-invite|new-business)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/html.conf;
    try_files /index.html =404;
  }

  location = /app {
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/html.conf;
    try_files /index.html =404;
  }

  location /app/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/html.conf;
    try_files /index.html =404;
  }

  location / {
    include /etc/nginx/snippets/html.conf;
    # One address per page: /modules/ redirects to /modules.
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri/index.html =404;
  }

  # Unknown addresses get a real 404 status, so search engines drop them, and the app's page.
  error_page 404 /index.html;
}
