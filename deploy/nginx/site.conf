upstream api {
  server api:8000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  limit_conn perip 30;

  # $request_id is 32 random hex characters per request: a fresh nonce for the CSP below.
  set $csp_nonce $request_id;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location /api/accounts/ {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|site\.webmanifest|favicon\.svg|og-image\.png|apple-touch-icon\.png)$ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /app {
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/html.conf;
    try_files /index.html =404;
  }

  location /app/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/html.conf;
    try_files /index.html =404;
  }

  location / {
    include /etc/nginx/snippets/html.conf;
    try_files $uri $uri/index.html /index.html;
  }
}
