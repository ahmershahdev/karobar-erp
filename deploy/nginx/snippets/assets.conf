# Files in /assets/ are named by content hash, so they can be cached for good. A nested location or
# an add_header in one drops the headers set above it, which is why they are all kept here.
add_header Cache-Control "public, max-age=31536000, immutable" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Vary "Accept-Encoding" always;
