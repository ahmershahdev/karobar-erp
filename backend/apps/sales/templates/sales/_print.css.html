<style>
  @page { size: A4; margin: 18mm 16mm; }
  body { font-family: "Noto Sans", sans-serif; color: #0b1a3c; font-size: 11pt; line-height: 1.5; }
  html[lang="ur"] body { font-family: "Noto Nastaliq Urdu", "Noto Sans", serif; line-height: 2.1; }
  html[lang="ar"] body { font-family: "Noto Kufi Arabic", "Noto Sans", sans-serif; line-height: 1.8; }
  h1 { font-size: 20pt; font-weight: 500; margin: 0 0 2mm; }
  .head { display: flex; justify-content: space-between; border-bottom: 1px solid #c8cdd8; padding-bottom: 5mm; margin-bottom: 7mm; }
  .business { font-size: 14pt; font-weight: 600; }
  .muted { color: #566076; }
  .facts { width: 100%; margin-bottom: 7mm; }
  table.lines { width: 100%; border-collapse: collapse; }
  table.lines th { text-align: start; color: #566076; font-weight: 400; border-bottom: 1px solid #c8cdd8; padding: 2mm 1mm; }
  table.lines td { border-bottom: 1px solid #eef0f4; padding: 2.5mm 1mm; }
  /* Figures stay left to right in Urdu and Arabic, so their side is set by hand, not with end. */
  .num { font-family: "Noto Sans", sans-serif; font-weight: 400; direction: ltr; unicode-bidi: isolate; }
  table.lines th.num { font-family: inherit; }
  html[dir="ltr"] table.lines .num { text-align: right; }
  html[dir="rtl"] table.lines .num { text-align: left; }
  .totals { margin-top: 6mm; margin-inline-start: auto; width: 45%; }
  .totals div { display: flex; justify-content: space-between; padding: 1mm 0; }
  .grand .num { font-weight: 600; }
  .grand { border-top: 1px solid #0b1a3c; font-weight: 600; margin-top: 1mm; padding-top: 2mm !important; }
  .logo { max-height: 22mm; max-width: 60mm; margin-bottom: 2mm; }
  .from .muted { font-size: 9.5pt; }
  .doc { text-align: end; }
  h1, .business { color: {{ accent }}; }
  .head { border-bottom-color: {{ accent }}; }
  .grand { border-top-color: {{ accent }}; }
  .foot { margin-top: 10mm; border-top: 1px solid #c8cdd8; padding-top: 4mm; font-size: 9.5pt; color: #566076; }
  .foot p { margin: 0 0 3mm; }
  .foot .thanks { color: {{ accent }}; font-size: 11pt; }
  /* A till roll: one narrow column, small type, nothing side by side. */
  @page receipt { size: 80mm 297mm; margin: 4mm; }
  html.receipt body { page: receipt; font-size: 8.5pt; }
  html.receipt .head { display: block; padding-bottom: 3mm; margin-bottom: 3mm; }
  html.receipt .doc { text-align: start; margin-top: 2mm; }
  html.receipt h1 { font-size: 12pt; }
  html.receipt .business { font-size: 11pt; }
  html.receipt .logo { max-height: 14mm; max-width: 40mm; }
  html.receipt .facts { margin-bottom: 3mm; }
  html.receipt table.lines th, html.receipt table.lines td { padding: 1mm 0.5mm; }
  html.receipt .totals { width: 100%; margin-top: 3mm; }
  html.receipt .foot { margin-top: 4mm; font-size: 8pt; }
</style>
