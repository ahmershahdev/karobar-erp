components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
      required:
      - token
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 150
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: integer
          nullable: true
        is_group:
          type: boolean
        is_active:
          type: boolean
        role:
          type: string
          readOnly: true
          nullable: true
      required:
      - code
      - id
      - name
      - role
      - type
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - post
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `post` - Post
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        model:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        changes:
          readOnly: true
        user:
          type: string
          format: email
          readOnly: true
          nullable: true
        at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - at
      - changes
      - id
      - model
      - object_id
      - user
    Email:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    FiscalPeriod:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        start:
          type: string
          format: date
          readOnly: true
        end:
          type: string
          format: date
          readOnly: true
        closed:
          type: boolean
          readOnly: true
      required:
      - closed
      - end
      - id
      - number
      - start
    FiscalYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 40
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        periods:
          type: array
          items:
            $ref: '#/components/schemas/FiscalPeriod'
          readOnly: true
      required:
      - end
      - id
      - periods
      - start
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: integer
          nullable: true
        role_name:
          type: string
          readOnly: true
          nullable: true
        status:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - expires_at
      - id
      - role_name
      - status
    JournalEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
          nullable: true
        date:
          type: string
          format: date
        memo:
          type: string
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
        total:
          type: string
          readOnly: true
        reversal_of:
          type: integer
          readOnly: true
          nullable: true
        reversed_by:
          type: integer
          nullable: true
          readOnly: true
        created_by:
          type: string
          format: email
          readOnly: true
        posted_by:
          type: string
          format: email
          readOnly: true
          nullable: true
        posted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_by
      - date
      - id
      - lines
      - number
      - posted_at
      - posted_by
      - reversal_of
      - reversed_by
      - status
      - total
