components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          maxLength: 128
      required:
      - token
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 150
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: integer
          nullable: true
        is_group:
          type: boolean
        is_active:
          type: boolean
        role:
          type: string
          readOnly: true
          nullable: true
      required:
      - code
      - id
      - name
      - role
      - type
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - post
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `post` - Post
    AgeingRow:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        current:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        days_1_30:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        days_31_60:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        days_61_90:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        over_90:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        advance:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - advance
      - current
      - days_1_30
      - days_31_60
      - days_61_90
      - id
      - name
      - over_90
      - total
    Alerts:
      type: object
      properties:
        low_stock:
          type: array
          items:
            type: object
            additionalProperties: {}
        expiring:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - expiring
      - low_stock
    Allocation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bill:
          type: integer
        bill_number:
          type: string
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - amount
      - bill
      - bill_number
      - id
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        model:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        changes:
          readOnly: true
        user:
          type: string
          format: email
          readOnly: true
          nullable: true
        at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - at
      - changes
      - id
      - model
      - object_id
      - user
    AuthConfig:
      type: object
      properties:
        recaptcha_v3_site_key:
          type: string
        recaptcha_v2_site_key:
          type: string
        oauth_providers:
          type: array
          items:
            type: string
      required:
      - oauth_providers
      - recaptcha_v2_site_key
      - recaptcha_v3_site_key
    Automation:
      type: object
      properties:
        daily_summary:
          type: boolean
      required:
      - daily_summary
    BalanceSheet:
      type: object
      properties:
        assets:
          $ref: '#/components/schemas/ReportSection'
        liabilities:
          $ref: '#/components/schemas/ReportSection'
        equity:
          $ref: '#/components/schemas/ReportSection'
        profit_to_date:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        total_liabilities_and_equity:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        balanced:
          type: boolean
      required:
      - assets
      - balanced
      - equity
      - liabilities
      - profit_to_date
      - total_liabilities_and_equity
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        expiry_date:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - expiry_date
      - id
      - number
      - product
    Bill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
          nullable: true
        status:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        memo:
          type: string
          maxLength: 255
        supplier:
          type: integer
        supplier_name:
          type: string
          readOnly: true
        supplier_reference:
          type: string
          maxLength: 40
        due_date:
          type: string
          format: date
          nullable: true
        net:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLine'
        journal_number:
          type: string
          readOnly: true
          nullable: true
        created_by:
          type: string
          format: email
          readOnly: true
        posted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - amount_paid
      - created_by
      - date
      - id
      - journal_number
      - lines
      - net
      - number
      - posted_at
      - status
      - supplier
      - supplier_name
      - tax
      - total
    BillLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        receipt_line:
          type: integer
          nullable: true
        account:
          type: integer
          nullable: true
        account_name:
          type: string
          readOnly: true
          nullable: true
        description:
          type: string
          maxLength: 255
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - account_name
      - amount
      - id
      - quantity
      - unit_price
    BillShare:
      type: object
      properties:
        link:
          type: string
        whatsapp:
          type: string
      required:
      - link
      - whatsapp
    CartLine:
      type: object
      properties:
        product:
          type: integer
        unit:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
      required:
      - product
      - quantity
      - unit
    CashFlow:
      type: object
      properties:
        opening:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        from_customers:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        to_suppliers:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        other:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        closing:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - closing
      - from_customers
      - opening
      - other
      - to_suppliers
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
      required:
      - id
      - name
    ChatAsk:
      type: object
      properties:
        message:
          type: string
          maxLength: 2000
        language:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
