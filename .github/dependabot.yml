version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Django 5.2 is the long-term support release (to April 2028). The move to Django 6
      # is planned after v1.0.0, together with its type stubs.
      - dependency-name: django
        update-types: [version-update:semver-major]
      - dependency-name: django-stubs
        update-types: [version-update:semver-major]
      - dependency-name: djangorestframework-stubs
        versions: [">=3.17"]
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # i18next 27 and react-i18next 18 must move together and touch every translated screen.
      # They wait until after v1.0.0, when browser tests can catch a regression.
      - dependency-name: i18next
        update-types: [version-update:semver-major]
      - dependency-name: react-i18next
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: monthly
