version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: monthly
