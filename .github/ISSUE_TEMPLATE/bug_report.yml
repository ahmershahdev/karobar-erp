name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The module (inventory, sales, purchasing, accounting, payroll), the document or screen, and the clicks or request. Never paste real customer or employee data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
