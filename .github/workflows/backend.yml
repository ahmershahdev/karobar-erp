name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: karobar
          MYSQL_USER: karobar
          MYSQL_PASSWORD: karobar
          MYSQL_ROOT_PASSWORD: karobar-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pkarobar-root"
          --health-interval=5s --health-retries=30
      redis:
        image: redis:8.10.3-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      SITE_URL: http://localhost:5173
      DATABASE_URL: mysql://karobar:karobar@127.0.0.1:3306/karobar
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements/dev.txt
      - name: Let the app user create the test database
        run: mysql -h 127.0.0.1 -uroot -pkarobar-root -e "GRANT ALL PRIVILEGES ON \`test\_karobar\`.* TO 'karobar'@'%';"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u openapi.yaml /tmp/openapi.yaml
      - run: pytest --cov-fail-under=95
      - name: apps/core has full branch coverage
        run: pytest tests/core --noconftest -p no:django --cov=apps/core --cov-branch --cov-fail-under=100 -o addopts=""
      - run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
        env:
          EMAIL_HOST: smtp.invalid
          EMAIL_HOST_USER: ci
          EMAIL_HOST_PASSWORD: ci
          DEFAULT_FROM_EMAIL: ci@example.test
          DJANGO_SECRET_KEY: ci-only-a-long-enough-key-for-the-deploy-check-0123456789abcdefghij
